  <path fill="#ffffff" d="M8.6 2.2h6.8a1.1 1.1 0 0 1 0 2.2h-0.4v4.4l5.6 10.1a1.7 1.7 0 0 1-1.5 2.6H5.9a1.7 1.7 0 0 1-1.5-2.6L10 8.8V4.4H9.6a1.1 1.1 0 0 1 0-2.2Z"/>
