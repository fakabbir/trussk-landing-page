<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Trussk favicon: a DELIBERATELY simplified form of the app mark.
       The full mark is a stroked flask holding a check (src/components/Mark.jsx).
       Rendered at 16px in a browser tab both the outline and the check break
       down - tested, the check reads as a notch and muddies the silhouette - so
       the favicon is the solid flask alone. The flask is the distinctive half:
       a check on its own would be generic, a flask is not. -->
